# Вся система в контейнерах: PostgreSQL, Kafka (KRaft), MailHog,
# config-server, discovery-server (Eureka), api-gateway, user-service, notification-service.
#
#   docker compose up -d --build --wait     # сборка и запуск, --wait ждёт healthy у всех сервисов
#   ./scripts/smoke-test.sh                 # проверка взаимодействия сервисов
#   docker compose down -v                  # остановка (-v — вместе с данными PostgreSQL)
#
# Только инфраструктура для запуска сервисов из IDE:
#   docker compose up -d postgres kafka mailhog

# Эти переменные нужны config-server'у: ${VAR:default} в config-repo/*.yml подставляются из окружения.
# Те же значения передаём и клиентам — на случай, если плейсхолдер раскрывается на стороне клиента.
x-shared-env: &shared-env
  EUREKA_URL: http://discovery-server:8761/eureka/
  DB_URL: jdbc:postgresql://postgres:5432/AstonHW
  DB_USERNAME: admin
  DB_PASSWORD: "1234"
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  MAIL_HOST: mailhog
  MAIL_PORT: "1025"

x-spring-healthcheck: &spring-healthcheck
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 40s

services:
  # ---------------- инфраструктура ----------------
  postgres:
    image: postgres:16
    container_name: aston-postgres
    environment:
      POSTGRES_DB: AstonHW
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: "1234"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d AstonHW"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    container_name: aston-kafka
    ports:
      - "9092:9092"            # для клиентов с хоста (IDE): localhost:9092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # INTERNAL — для контейнеров (kafka:29092), EXTERNAL — для хоста (localhost:9092)
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # Ловит все исходящие письма. Веб-интерфейс: http://localhost:8025
  mailhog:
    image: mailhog/mailhog
    container_name: aston-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

  # ---------------- Spring Cloud ----------------
  config-server:
    build: { context: ., args: { MODULE: config-server } }
    image: aston/config-server
    container_name: aston-config-server
    environment:
      <<: *shared-env
    ports:
      - "8888:8888"
    healthcheck:
      # у config-server нет actuator — проверяем, что он отдаёт конфигурацию
      test: ["CMD-SHELL", "wget -qO- http://localhost:8888/user-service/default > /dev/null"]
      <<: *spring-healthcheck

  discovery-server:
    build: { context: ., args: { MODULE: discovery-server } }
    image: aston/discovery-server
    container_name: aston-discovery-server
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/eureka/apps > /dev/null"]
      <<: *spring-healthcheck

  # ---------------- микросервисы ----------------
  user-service:
    build: { context: ., args: { MODULE: user-service } }
    image: aston/user-service
    container_name: aston-user-service
    environment:
      <<: *shared-env
      CONFIG_SERVER_URL: http://config-server:8888
    depends_on:
      config-server:    { condition: service_healthy }
      discovery-server: { condition: service_healthy }
      postgres:         { condition: service_healthy }
      kafka:            { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health > /dev/null"]
      <<: *spring-healthcheck

  notification-service:
    build: { context: ., args: { MODULE: notification-service } }
    image: aston/notification-service
    container_name: aston-notification-service
    environment:
      <<: *shared-env
      CONFIG_SERVER_URL: http://config-server:8888
    depends_on:
      config-server:    { condition: service_healthy }
      discovery-server: { condition: service_healthy }
      kafka:            { condition: service_healthy }
      mailhog:          { condition: service_started }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health > /dev/null"]
      <<: *spring-healthcheck

  api-gateway:
    build: { context: ., args: { MODULE: api-gateway } }
    image: aston/api-gateway
    container_name: aston-api-gateway
    environment:
      <<: *shared-env
      CONFIG_SERVER_URL: http://config-server:8888
    ports:
      - "8080:8080"            # единственная точка входа для клиентов
    depends_on:
      config-server:        { condition: service_healthy }
      discovery-server:     { condition: service_healthy }
      user-service:         { condition: service_healthy }
      notification-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health > /dev/null"]
      <<: *spring-healthcheck

volumes:
  postgres-data:
