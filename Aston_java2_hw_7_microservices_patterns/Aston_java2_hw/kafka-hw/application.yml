# Общие настройки для ВСЕХ сервисов
eureka:
  client:
    service-url:
      # в Docker-сети адрес реестра — http://discovery-server:8761/eureka/ (задаётся переменной EUREKA_URL)
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
