# Настройки user-service (раньше лежали в user-service/src/main/resources/application.yml)
# ВАЖНО: ${VAR:default} здесь разворачивается на стороне config-server, т.е. по его переменным окружения.
server:
  port: 8082
  # gateway передаёт X-Forwarded-* — HATEOAS-ссылки и Swagger будут строиться с адресом gateway, а не сервиса
  forward-headers-strategy: framework

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/AstonHW}
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:1234}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        spring.json.add.type.headers: false
        max.block.ms: 5000

app:
  kafka:
    topic: ${USER_EVENTS_TOPIC:user-events}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
