spring:
  application:
    name: user-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/AstonHW}
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:1234}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        # не добавляем в заголовки имя Java-класса: notification-service имеет свой DTO
        spring.json.add.type.headers: false
        # если Kafka недоступна — не висим на запросе пользователя дольше 5 секунд
        max.block.ms: 5000

app:
  kafka:
    topic: ${USER_EVENTS_TOPIC:user-events}

server:
  port: 8080

logging:
  level:
    root: INFO
